# Include this file inside the Nginx server listening on port 5205.
# The React build remains the fallback location; Flask-owned routes are
# explicitly proxied to the private Gunicorn listener.

# Keep this aligned with Flask's MAX_CONTENT_LENGTH (100 MB). Without this,
# Nginx rejects uploads larger than its 1 MB default before Flask sees them.
client_max_body_size 100m;

# The application shell points to hashed JS/CSS assets and must not be cached.
# Otherwise clients can keep loading an older bundle after a deployment.
location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;
}

location = /preview {
    try_files /index.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;
}

location /api/ {
    proxy_pass http://127.0.0.1:5206;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:5206;
    proxy_set_header Host $host;
}

location ^~ /admin {
    proxy_pass http://127.0.0.1:5206;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /moderator {
    proxy_pass http://127.0.0.1:5206;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /apidocs {
    proxy_pass http://127.0.0.1:5206;
}

location = /openapi.json {
    proxy_pass http://127.0.0.1:5206;
}
